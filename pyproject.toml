[project]
name = "spotify-slack-sync-fredagslistan"
version = "0.1.0"
description = "Sync Spotify tracks shared in a Slack channel to a yearly collaborative playlist."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "requests>=2.33.1,<3.0.0",
    "slack-sdk>=3.41.0,<4.0.0",
    "python-dotenv>=1.2.0,<2.0.0",
    "spotipy>=2.24.0,<3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10.0.0",
    "freezegun>=1.5.0,<2.0.0",
    "ruff>=0.16.0",
    "pyright>=1.1.400",
]

# This is a runnable application, not an installable package.
[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 99
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "ARG", "S110", "S112"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S101", "ARG"]

[tool.ruff.format]
line-ending = "lf"

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.13"
include = ["main.py", "utils"]
exclude = ["tests", "**/__pycache__", ".venv", ".claude"]
