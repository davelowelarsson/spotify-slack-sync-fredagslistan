name: Quality

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  # Single required check (reserved name `quality`) so branch protection can
  # require one gate once the repo is public. Runs lint, format, types, tests.
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        # --locked proves the committed uv.lock matches pyproject.toml (fails on drift)
        run: uv sync --locked --dev

      - name: Ruff check
        run: uv run ruff check

      - name: Ruff format check
        run: uv run ruff format --check

      - name: Pyright
        run: uv run pyright

      - name: Pytest
        run: uv run pytest -q
