name: Run main.py

on:
  push:
    branches: [ main ]
  schedule:
    # Every Friday, every 15 min, 07-19 UTC (09-21 CEST / 08-20 CET).
    # Offset 3 min off the quarter marks: GitHub's schedule event is
    # best-effort and jobs are delayed or dropped under load, worst at the
    # top of the hour, so the docs advise not scheduling on it. Runs are
    # idempotent (6-day window, diffed against the playlist), so delayed or
    # duplicate runs are harmless and a dropped one is covered by the next.
    - cron: '3,18,33,48 7-19 * * 5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Run tests
        run: uv run pytest -q

      # Phase 2 (#17): push -> DRY_RUN. A push to main self-tests the full
      # pipeline (reads, search, compare) with ZERO side effects; scheduled and
      # manual (workflow_dispatch) runs stay real. DRY_RUN=1 only on push.
      # Secrets are scoped to this step only (least privilege) — earlier steps
      # (checkout, uv install, tests) never receive them.
      - name: Run main.py
        id: sync
        env:
          DRY_RUN: ${{ github.event_name == 'push' && '1' || '0' }}
          SLACK_API_TOKEN: ${{ secrets.SLACK_API_TOKEN }}
          SPOTIPY_CLIENT_ID: ${{ secrets.SPOTIPY_CLIENT_ID }}
          SPOTIPY_CLIENT_SECRET: ${{ secrets.SPOTIPY_CLIENT_SECRET }}
          SPOTIPY_REDIRECT_URI: ${{ secrets.SPOTIPY_REDIRECT_URI }}
          # Headless Spotify auth: the app authenticates from this refresh token
          # held in memory — there is no committed .cache. If this secret is ever
          # missing, the run fails fast with a clear error (see spotify_access_token).
          SPOTIPY_REFRESH_TOKEN: ${{ secrets.SPOTIPY_REFRESH_TOKEN }}
          # Durable per-year state, read from repo variables. Any of these may
          # be empty (e.g. before the first persisted run) — the app tolerates
          # absent/blank values. main.py NEVER calls the GitHub API; it only
          # reads these env vars and emits new values as step outputs below.
          FREDAGSLISTAN_PLAYLIST_ID: ${{ vars.FREDAGSLISTAN_PLAYLIST_ID }}
          FREDAGSLISTAN_PLAYLIST_YEAR: ${{ vars.FREDAGSLISTAN_PLAYLIST_YEAR }}
          FREDAGSLISTAN_SEARCH_FAILURES: ${{ vars.FREDAGSLISTAN_SEARCH_FAILURES }}
          FREDAGSLISTAN_FAILURE_THRESHOLD: ${{ vars.FREDAGSLISTAN_FAILURE_THRESHOLD }}
        run: uv run python main.py

      # Persist the computed durable state back into repo variables so the next
      # run remembers the resolved playlist AND the failure counter. This runs
      # whenever main.py emitted outputs (including on a safe ABORT), because
      # the incremented counter MUST survive to the next run — that is why
      # main.py always exits 0 and the build is only failed in a LATER step.
      # Skipped on a dry-run push: a self-test must never persist state.
      #
      # `always()` is critical: main.py emits its outputs BEFORE the announce/
      # sync network calls, so even if one of those crashes the Run step, the
      # resolved (possibly just-created) playlist id has already been written
      # and MUST still be persisted here — otherwise the next run forgets it and
      # could recreate + re-announce the playlist.
      #
      # Requires a fine-grained PAT `GH_STATE_TOKEN` (single-repo,
      # Variables: read/write) provisioned by the repo owner. Without it this
      # step errors, but `continue-on-error` keeps the job green: the sync
      # still runs, it just won't remember state between runs.
      - name: Persist playlist state
        # always(): persist even if the announce/sync step crashed (state was
        # already emitted before those writes). Excluded on a dry-run push.
        if: ${{ always() && steps.sync.outputs.action != '' && github.event_name != 'push' }}
        continue-on-error: true
        # Step outputs are passed via env (never interpolated straight into the
        # shell) and referenced quoted, to avoid any command-injection surface.
        env:
          GH_TOKEN: ${{ secrets.GH_STATE_TOKEN }}
          PLAYLIST_ID: ${{ steps.sync.outputs.playlist_id }}
          PLAYLIST_YEAR: ${{ steps.sync.outputs.playlist_year }}
          SEARCH_FAILURES: ${{ steps.sync.outputs.search_failures }}
        run: |
          gh variable set FREDAGSLISTAN_PLAYLIST_ID --body "$PLAYLIST_ID"
          gh variable set FREDAGSLISTAN_PLAYLIST_YEAR --body "$PLAYLIST_YEAR"
          gh variable set FREDAGSLISTAN_SEARCH_FAILURES --body "$SEARCH_FAILURES"

      # Turn the build red (→ notification email) ONLY after state was
      # persisted, based on the emitted exit_code (e.g. failure counter reached
      # the threshold). Keeping this separate is what lets the counter survive.
      # Skipped on a dry-run push: a self-test must never redden the build.
      - name: Fail job if sync reported a non-zero exit code
        if: ${{ steps.sync.outputs.exit_code != '0' && github.event_name != 'push' }}
        run: |
          echo "Sync reported exit_code=${{ steps.sync.outputs.exit_code }}"
          echo "Search failures reached the configured threshold — failing the build."
          exit 1
