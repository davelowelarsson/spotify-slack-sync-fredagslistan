name: Run main.py

on:
  push:
    branches: [ main ]
  schedule:
    # Run every Friday between 08:00 and 18:00
    - cron:  '*/15 7-19 * * 5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    env:
      SLACK_API_TOKEN: ${{ secrets.SLACK_API_TOKEN }}
      SPOTIPY_CLIENT_ID: ${{ secrets.SPOTIPY_CLIENT_ID }}
      SPOTIPY_CLIENT_SECRET: ${{ secrets.SPOTIPY_CLIENT_SECRET }}
      SPOTIPY_REDIRECT_URI: ${{ secrets.SPOTIPY_REDIRECT_URI }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests
        run: uv run pytest -q

      # NOTE: `push` currently runs a real sync. Phase 2 (#17) wires push -> DRY_RUN
      # so pushes self-test without writing to Spotify/Slack; scheduled and manual
      # (workflow_dispatch) runs stay real.
      - name: Run main.py
        run: uv run python main.py
