name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    # Only Dependabot's own PRs. Minor + patch updates (uv AND github-actions)
    # auto-merge once the required `quality` check passes; majors stay open for
    # David's review.
    #
    # DORMANT until the repo is public (#22): branch protection with a required
    # `quality` check and "Allow auto-merge" are unavailable on a private repo
    # on this plan, so `gh pr merge --auto` has nothing to wait on. Once public,
    # enable "Allow auto-merge" + a branch-protection rule requiring `quality`
    # and this workflow starts merging automatically — no code change needed.
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch update metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable auto-merge for minor and patch updates
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
